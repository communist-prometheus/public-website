name: Bootstrap admin-website secrets

on:
  workflow_dispatch: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Cloudflare secrets to admin-website
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set CLOUDFLARE_API_TOKEN \
            --repo communist-prometheus/admin-website \
            --body "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          gh secret set CLOUDFLARE_ACCOUNT_ID \
            --repo communist-prometheus/admin-website \
            --body "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          echo "Secrets bootstrapped"
