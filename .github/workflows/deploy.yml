name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master, develop]
  # A content update in `public-website-content` triggers a deploy of the
  # matching branch through this dispatch — NOT by pushing an empty commit
  # into this repo. That keeps the code branches free of content-driven
  # commits, so a `develop → master` PR here is a review of code alone.
  # `content: true` marks such a redeploy so the E2E gate is skipped (a
  # content-only change can't move code-shaped assertions).
  workflow_dispatch:
    inputs:
      content:
        description: Content redeploy (skip the E2E gate)
        type: boolean
        default: false

# Serialise deploys per ref. When a new commit arrives while an older
# deploy is still building, cancel the in-flight one — its image would
# otherwise overwrite the newer commit's image.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN - deploys use dedicated secrets,
# nothing here needs repo write access via the ambient token.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CONTENT_BRANCH mirrors github.ref_name 1:1 — master deploys
    # build with content/master, develop deploys with content/develop.
    # WRANGLER_COMMAND is resolved by the "Resolve branch env" step
    # below so we don't carry an inline ternary into the wrangler call.
    env:
      CONTENT_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Cloning git repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # e2e-toolkit lives in a separate repo and is wired as a
          # submodule. Without this, the e2e tsconfig path mapping
          # would point at an empty directory and astro check fails.
          submodules: true

      - name: Resolve branch env
        run: |
          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            echo "WRANGLER_COMMAND=deploy --env develop" >> "$GITHUB_ENV"
            echo "SITE_BASE=https://dev.comprom.org" >> "$GITHUB_ENV"
          else
            echo "WRANGLER_COMMAND=deploy" >> "$GITHUB_ENV"
            echo "SITE_BASE=https://comprom.org" >> "$GITHUB_ENV"
          fi

      - name: Installing tools and dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile

      # Content-only redeploys can't break a unit test, but they cost
      # seconds to check and a deploy is the last gate before prod.
      - name: Running unit tests
        run: bun run test:unit

      # CONTENT_QUARANTINE: a content file with unbuildable frontmatter is
      # left out of the build (warning annotation + job summary) instead of
      # failing the whole deploy — one editor's bad paste on github.com must
      # not block every other publish. The prebuild `check-frontmatter`
      # step names the file + line; the content repo's own check turns red
      # on the offending push so the author is told.
      - name: Building application (static site)
        run: bun run build
        env:
          CONTENT_QUARANTINE: '1'

      # E2E asserts a fixed shape of master content (specific languages,
      # specific blog/positions slugs). The develop branch deliberately
      # carries a smaller content set, so the same assertions don't
      # apply there. Skip E2E on develop deploys; master deploys still
      # gate on green E2E.
      - name: Installing Playwright browsers
        if: ${{ github.ref_name == 'master' && github.event.inputs.content != 'true' && !contains(github.event.head_commit.message, '[sync-from-content]') }}
        run: bunx playwright install --with-deps chromium

      - name: Running E2E tests (chromium, skip lighthouse/mobile)
        if: ${{ github.ref_name == 'master' && github.event.inputs.content != 'true' && !contains(github.event.head_commit.message, '[sync-from-content]') }}
        run: bunx playwright test --project=chromium --reporter=line

      # The build above (and the e2e it feeds) keep the archive section
      # ON so its suite stays green; production ships with it OFF until
      # it's signed off. Rebuild master-only with the flag forced off so
      # the deployed bundle emits no archive pages, nav, widget, or
      # sitemap entries. Dev/develop deploys the archive-on build as-is.
      - name: Rebuilding without the archive section (production)
        if: ${{ github.ref_name == 'master' }}
        # content already fetched + code already validated by the first
        # build — just re-emit the static output with the flag off.
        run: PUBLIC_FEATURE_ARCHIVE=false bunx astro build

      - name: Deploying to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          wranglerVersion: "4.80.0"
          # WRANGLER_COMMAND was resolved by the "Resolve branch env"
          # step (deploy --env develop on develop, deploy on master).
          command: ${{ env.WRANGLER_COMMAND }}

      # Semantic search reads a vector store, and a vector store is only
      # as true as its last update. The Worker re-embeds ONLY the articles
      # whose content hash moved, so an ordinary deploy costs one call and
      # a few seconds; a fresh index costs a few minutes, once.
      #
      # It runs after the deploy because the Worker indexes what the
      # deploy is actually serving — it reads the index through its own
      # ASSETS binding.
      #
      # `continue-on-error`: the deploy above IS the publication — the site
      # is already live. Re-embedding is a follow-on that keeps semantic
      # search fresh; if it fails the article is still published, so it must
      # NOT turn the run red. A failed step stays visible (and now returns a
      # diagnosable JSON error via the Worker's top-level guard) without
      # conflating "published" with "indexed".
      - name: Re-embedding changed articles
        continue-on-error: true
        run: bun scripts/reindex.ts --base "$SITE_BASE"
        env:
          REINDEX_SECRET: ${{ secrets.REINDEX_SECRET }}
