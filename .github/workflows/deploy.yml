name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]

# Serialise deploys per ref. When a new commit on master arrives while
# an older deploy is still building, cancel the in-flight one — its
# image would otherwise overwrite the newer commit's image. This
# prevents the race we saw between a code push and a content-sync
# subtree commit landing seconds apart.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cloning git repository
        uses: actions/checkout@v4

      - name: Installing tools and dependencies
        uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Building application (static site)
        run: bun run build

      - name: Installing Playwright browsers
        if: ${{ !startsWith(github.event.head_commit.message, 'content:') }}
        run: bunx playwright install --with-deps chromium

      - name: Running E2E tests (chromium, skip lighthouse/mobile)
        if: ${{ !startsWith(github.event.head_commit.message, 'content:') }}
        run: bunx playwright test --project=chromium --reporter=line

      - name: Deploying to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          wranglerVersion: "4.80.0"
