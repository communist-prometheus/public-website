name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master, develop]

# Serialise deploys per ref. When a new commit arrives while an older
# deploy is still building, cancel the in-flight one — its image would
# otherwise overwrite the newer commit's image.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CONTENT_BRANCH mirrors github.ref_name 1:1 — master deploys
    # build with content/master, develop deploys with content/develop.
    # WRANGLER_COMMAND is resolved by the "Resolve branch env" step
    # below so we don't carry an inline ternary into the wrangler call.
    env:
      CONTENT_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Cloning git repository
        uses: actions/checkout@v4
        with:
          # e2e-toolkit lives in a separate repo and is wired as a
          # submodule. Without this, the e2e tsconfig path mapping
          # would point at an empty directory and astro check fails.
          submodules: true

      - name: Resolve branch env
        run: |
          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            echo "WRANGLER_COMMAND=deploy --env develop" >> "$GITHUB_ENV"
          else
            echo "WRANGLER_COMMAND=deploy" >> "$GITHUB_ENV"
          fi

      - name: Installing tools and dependencies
        uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Building application (static site)
        run: bun run build

      # E2E asserts a fixed shape of master content (specific languages,
      # specific blog/positions slugs). The develop branch deliberately
      # carries a smaller content set, so the same assertions don't
      # apply there. Skip E2E on develop deploys; master deploys still
      # gate on green E2E.
      #
      # Cache the Playwright browser bundle keyed by lockfile — without
      # this, `playwright install --with-deps` re-downloads chromium
      # + apt-installs system libs on every run, which can hang for
      # 10+ minutes when the upstream mirrors are slow.
      - name: Cache Playwright browsers
        if: ${{ github.ref_name == 'master' && !startsWith(github.event.head_commit.message, 'content:') }}
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Installing Playwright browsers
        if: ${{ github.ref_name == 'master' && !startsWith(github.event.head_commit.message, 'content:') && steps.pw-cache.outputs.cache-hit != 'true' }}
        run: bunx playwright install --with-deps chromium

      - name: Installing Playwright system deps (cache hit)
        if: ${{ github.ref_name == 'master' && !startsWith(github.event.head_commit.message, 'content:') && steps.pw-cache.outputs.cache-hit == 'true' }}
        run: bunx playwright install-deps chromium

      - name: Running E2E tests (chromium, skip lighthouse/mobile)
        if: ${{ github.ref_name == 'master' && !startsWith(github.event.head_commit.message, 'content:') }}
        run: bunx playwright test --project=chromium --reporter=line

      - name: Deploying to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          wranglerVersion: "4.80.0"
          # WRANGLER_COMMAND was resolved by the "Resolve branch env"
          # step (deploy --env develop on develop, deploy on master).
          command: ${{ env.WRANGLER_COMMAND }}
