name: Sync content from content repo

on:
  repository_dispatch:
    types: [content-updated]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git author from content commit
        env:
          AUTHOR_NAME: ${{ github.event.client_payload.author_name }}
          AUTHOR_EMAIL: ${{ github.event.client_payload.author_email }}
        run: |
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

      - name: Add content remote
        run: git remote add content https://github.com/communist-prometheus/public-website-content.git

      - name: Checkout target branch
        env:
          BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          git checkout "$BRANCH"
          git pull origin "$BRANCH"

      # Pass payload values via env (never inline into the script with
      # `${{ ... }}`). Inlining is fragile: a commit message that
      # contains a double quote, a backtick, or a $( expansion would
      # break the shell or run arbitrary commands. Env vars quoted as
      # "$MSG" are opaque strings to the shell.
      - name: Subtree pull from content repo
        env:
          BRANCH: ${{ github.event.client_payload.branch }}
          MSG: ${{ github.event.client_payload.commit_message }}
        run: |
          git subtree pull --prefix=src/content content "$BRANCH" \
            --squash -m "content: $MSG"

      - name: Push changes
        env:
          BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          git push origin "$BRANCH"
